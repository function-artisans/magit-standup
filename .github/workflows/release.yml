name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    name: Update the draft release
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Replace the draft release
        run: |
          if gh release view unreleased >/dev/null 2>&1; then
            gh release delete unreleased --yes
          fi
          gh release create unreleased \
            --draft \
            --target "${{ github.sha }}" \
            --title "Unreleased" \
            --generate-notes

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create the release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Remove the stale draft release
        run: |
          if gh release view unreleased >/dev/null 2>&1; then
            gh release delete unreleased --yes
          fi
