name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  draft:
    name: Update the draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    concurrency:
      group: release-draft
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Replace the draft release
        run: |
          if gh release view unreleased >/dev/null 2>&1; then
            gh release delete unreleased --yes
          fi
          gh release create unreleased \
            --draft \
            --target "${{ github.sha }}" \
            --title "Unreleased" \
            --generate-notes

  publish:
    name: Publish the release
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    concurrency:
      group: release-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Create the release
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tag="v$(sed -n 's/^;; Version: \(.*\)$/\1/p' magit-standup.el)"
          else
            tag="${{ github.ref_name }}"
          fi
          gh release create "${tag}" \
            --target "$(git rev-parse HEAD)" \
            --title "${tag}" \
            --generate-notes

      - name: Remove the stale draft release
        run: |
          if gh release view unreleased >/dev/null 2>&1; then
            gh release delete unreleased --yes
          fi
